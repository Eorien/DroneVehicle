# YOLO11n-OBB RGB-IR dual-stream model with adaptive P3/P4/P5 middle fusion.

# Parameters
nc: 80 # number of classes; overridden by the dataset configuration
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Input split and two modality-specific YOLO11 backbones
backbone:
  # [from, repeats, module, args]
  - [-1, 1, RGBIRSplit, []] # 0: (B,4,H,W) -> [RGB, IR]

  # RGB branch
  - [0, 1, Index, [3, 0]] # 1: RGB input
  - [-1, 1, Conv, [64, 3, 2]] # 2-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 3-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 4
  - [-1, 1, Conv, [256, 3, 2]] # 5-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 6-RGB P3
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 2, C3k2, [512, True]] # 8-RGB P4
  - [-1, 1, Conv, [1024, 3, 2]] # 9-P5/32
  - [-1, 2, C3k2, [1024, True]] # 10
  - [-1, 1, SPPF, [1024, 5]] # 11
  - [-1, 2, C2PSA, [1024]] # 12-RGB P5

  # IR branch
  - [0, 1, Index, [1, 1]] # 13: IR input
  - [-1, 1, Conv, [64, 3, 2]] # 14-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 15-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 16
  - [-1, 1, Conv, [256, 3, 2]] # 17-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 18-IR P3
  - [-1, 1, Conv, [512, 3, 2]] # 19-P4/16
  - [-1, 2, C3k2, [512, True]] # 20-IR P4
  - [-1, 1, Conv, [1024, 3, 2]] # 21-P5/32
  - [-1, 2, C3k2, [1024, True]] # 22
  - [-1, 1, SPPF, [1024, 5]] # 23
  - [-1, 2, C2PSA, [1024]] # 24-IR P5

  # Adaptive middle fusion, initialized as equal RGB/IR averaging
  - [[6, 18], 1, AdaptiveFeatureFusion, []] # 25-fused P3/8
  - [[8, 20], 1, AdaptiveFeatureFusion, []] # 26-fused P4/16
  - [[12, 24], 1, AdaptiveFeatureFusion, []] # 27-fused P5/32

# Shared original YOLO11 neck and OBB head
head:
  - [27, 1, nn.Upsample, [None, 2, "nearest"]] # 28
  - [[-1, 26], 1, Concat, [1]] # 29: fused P4
  - [-1, 2, C3k2, [512, False]] # 30

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 31
  - [[-1, 25], 1, Concat, [1]] # 32: fused P3
  - [-1, 2, C3k2, [256, False]] # 33 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 34
  - [[-1, 30], 1, Concat, [1]] # 35
  - [-1, 2, C3k2, [512, False]] # 36 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 37
  - [[-1, 27], 1, Concat, [1]] # 38
  - [-1, 2, C3k2, [1024, True]] # 39 (P5/32-large)

  - [[33, 36, 39], 1, OBB, [nc, 1]] # 40 OBB(P3, P4, P5)
